<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk & Autentikasi - WARISCRYPT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="css/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-ink-darker text-slate-200 min-h-screen flex flex-col justify-between">
  <!-- Nav -->
  <div id="main-nav"></div>

  <div class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="w-full max-w-md">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="wax-seal w-14 h-14 text-lg mx-auto mb-3">W</div>
        <h1 class="text-2xl font-bold font-cinzel text-willGold">WARISCRYPT</h1>
        <p class="text-xs text-slate-400">Masuk atau buat akun Anda</p>
      </div>

      <!-- Card Container -->
      <div class="will-card rounded-xl p-8 relative">
        <!-- Tabs Header -->
        <div class="flex border-b border-slate-700 mb-6">
          <button id="tab-login-btn" onclick="switchAuthTab('login')" class="flex-1 pb-3 text-sm font-semibold border-b-2 border-willGold text-willGold transition">
            Masuk
          </button>
          <button id="tab-register-btn" onclick="switchAuthTab('register')" class="flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">
            Daftar Akun
          </button>
        </div>

        <!-- Alert Notification -->
        <div id="auth-alert" class="hidden mb-4 p-3 rounded text-xs leading-relaxed"></div>

        <!-- TAB 1: LOGIN FORM -->
        <div id="login-section">
          <!-- Login Mode Toggle (Password vs Face) -->
          <div class="flex rounded-md bg-slate-900/60 p-1 mb-5 text-xs">
            <button id="subtab-pwd-btn" onclick="switchLoginMode('password')" class="flex-1 py-1.5 rounded font-medium bg-willGold text-ink-dark transition">
              Password
            </button>
            <button id="subtab-face-btn" onclick="switchLoginMode('face')" class="flex-1 py-1.5 rounded font-medium text-slate-400 hover:text-white transition flex items-center justify-center space-x-1">
              <i data-lucide="scan-face" class="w-3.5 h-3.5"></i>
              <span>Face Login</span>
            </button>
          </div>

          <!-- Password Form -->
          <form id="form-login-pwd" onsubmit="handlePasswordLogin(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Username atau Email</label>
              <input type="text" id="login-identifier" required class="w-full bg-slate-900/80 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-willGold" placeholder="pewaris / ahliwaris">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
              <input type="password" id="login-password" required class="w-full bg-slate-900/80 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-willGold" placeholder="••••••••">
            </div>

            <button type="submit" id="btn-login-submit" class="gold-btn w-full py-2.5 text-sm font-semibold mt-2">
              Masuk ke Vault
            </button>
          </form>

          <!-- Face Login Section -->
          <div id="form-login-face" class="hidden space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Username atau Email</label>
              <input type="text" id="face-login-identifier" class="w-full bg-slate-900/80 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-willGold" placeholder="pewaris">
            </div>

            <div class="border border-slate-700 rounded-lg p-2 bg-slate-900/90 text-center">
              <div class="relative w-full aspect-video bg-black rounded overflow-hidden mb-2">
                <video id="login-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="login-canvas" class="hidden"></canvas>
                <div id="camera-overlay" class="absolute inset-0 flex items-center justify-center text-xs text-slate-400 bg-slate-900/80">
                  Kamera belum aktif
                </div>
              </div>

              <div class="flex gap-2">
                <button type="button" onclick="startCamera('login')" class="flex-1 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded border border-slate-600">
                  Nyalakan Kamera
                </button>
                <button type="button" onclick="captureAndLoginFace()" class="flex-1 py-1.5 text-xs gold-btn font-semibold">
                  Verifikasi Wajah
                </button>
              </div>
            </div>
          </div>

          <!-- Quick Test Credentials -->
          <div class="mt-6 pt-4 border-t border-slate-800 text-xs text-slate-400">
            <span class="block mb-2 text-slate-500 font-semibold uppercase tracking-wider text-[10px]">Akun Uji Coba Cepat:</span>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="fillDemoCredentials('pewaris', 'Password123!')" class="p-2 bg-slate-900/70 border border-slate-800 rounded hover:border-willGold/40 text-left transition">
                <div class="text-willGold font-medium">Pewaris (Owner)</div>
                <div class="text-[10px] text-slate-400">pewaris / Password123!</div>
              </button>
              <button onclick="fillDemoCredentials('ahliwaris', 'Password123!')" class="p-2 bg-slate-900/70 border border-slate-800 rounded hover:border-willGold/40 text-left transition">
                <div class="text-rose-400 font-medium">Ahli Waris (Beneficiary)</div>
                <div class="text-[10px] text-slate-400">ahliwaris / Password123!</div>
              </button>
            </div>
          </div>
        </div>

        <!-- TAB 2: REGISTER FORM -->
        <div id="register-section" class="hidden">
          <form onsubmit="handleRegister(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Peran Akun</label>
              <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center space-x-2 p-2 bg-slate-900/80 border border-slate-700 rounded cursor-pointer">
                  <input type="radio" name="reg-role" value="owner" checked class="text-willGold focus:ring-0">
                  <span class="text-xs">Pewaris (Owner)</span>
                </label>
                <label class="flex items-center space-x-2 p-2 bg-slate-900/80 border border-slate-700 rounded cursor-pointer">
                  <input type="radio" name="reg-role" value="beneficiary" class="text-willGold focus:ring-0">
                  <span class="text-xs">Ahli Waris</span>
                </label>
              </div>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Nama Lengkap</label>
              <input type="text" id="reg-fullname" required class="w-full bg-slate-900/80 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-willGold" placeholder="Budi Santoso">
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Username</label>
                <input type="text" id="reg-username" required class="w-full bg-slate-900/80 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-willGold" placeholder="budis">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">No. HP (Opsional)</label>
                <input type="text" id="reg-phone" class="w-full bg-slate-900/80 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-willGold" placeholder="+62812...">
              </div>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Alamat Email</label>
              <input type="email" id="reg-email" required class="w-full bg-slate-900/80 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-willGold" placeholder="budi@example.com">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
              <input type="password" id="reg-password" required minlength="6" class="w-full bg-slate-900/80 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-willGold" placeholder="Minimal 6 karakter">
            </div>

            <!-- Optional Biometrics Capture on Signup -->
            <div class="border border-slate-800 rounded p-2.5 bg-slate-950/40">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-xs font-semibold text-willGold">Registrasi Biometrik Wajah</span>
                <span class="text-[10px] text-slate-400">(Opsional)</span>
              </div>
              <div class="relative w-full aspect-video bg-black rounded overflow-hidden mb-2">
                <video id="reg-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="reg-canvas" class="hidden"></canvas>
                <div id="reg-camera-overlay" class="absolute inset-0 flex items-center justify-center text-xs text-slate-400 bg-slate-900/80">
                  Kamera belum aktif
                </div>
              </div>
              <div class="flex gap-2">
                <button type="button" onclick="startCamera('reg')" class="flex-1 py-1 text-xs bg-slate-800 hover:bg-slate-700 rounded text-slate-200">
                  Aktifkan Kamera
                </button>
                <button type="button" onclick="captureFace('reg')" class="flex-1 py-1 text-xs bg-willGold/20 text-willGold border border-willGold/40 rounded">
                  Ambil Foto Profil
                </button>
              </div>
              <input type="hidden" id="reg-face-base64">
              <div id="reg-face-status" class="text-[10px] text-emerald-400 mt-1 hidden text-center">Foto wajah tersimpan!</div>
            </div>

            <button type="submit" id="btn-reg-submit" class="gold-btn w-full py-2 text-sm font-semibold mt-3">
              Daftar & Masuk
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-4 text-center text-xs text-slate-600">
    &copy; 2026 WARISCRYPT
  </footer>

  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/sign-in.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
